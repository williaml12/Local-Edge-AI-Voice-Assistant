services:
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-asr-webservice
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
      - ASR_DEVICE=cpu
    volumes:
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped

volumes:
  whisper_cache: